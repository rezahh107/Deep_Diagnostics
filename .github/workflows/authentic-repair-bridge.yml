name: Authentic runtime repair bridge

on:
  push:
    branches:
      - qualify/authentic-gravity-runtime
    paths:
      - '.github/workflows/authentic-repair-bridge.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualify/authentic-gravity-runtime
          fetch-depth: 0
      - name: Apply proven authentic-runtime repair and remove temporary bridges
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -dc > /tmp/authentic-repair.patch
          git apply --check /tmp/authentic-repair.patch
          git apply /tmp/authentic-repair.patch
          rm -f \
            .github/workflows/authentic-browser-bootstrap.yml \
            .github/workflows/authentic-qualification-bootstrap.yml \
            .github/workflows/authentic-source-bundle.yml \
            .github/workflows/authentic-repair-bridge.yml
          git config user.name 'rezahh107'
          git config user.email '84147076+rezahh107@users.noreply.github.com'
          git add -A
          git commit -m 'fix: qualify authentic Gravity refresh transport'
          git push origin HEAD:qualify/authentic-gravity-runtime
