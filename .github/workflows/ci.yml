name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: |
          set -euo pipefail
          printf '%s\0' wp-deep-diagnostics.php uninstall.php | xargs -0 -n1 php -l
          find src templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Focused privacy regression
        run: vendor/bin/phpunit tests/PrivacyBoundaryTest.php
      - name: Focused Cron diagnostics regression
        run: vendor/bin/phpunit tests/SessionStoreTest.php tests/CronDiagnosticsTest.php tests/CronReportTest.php tests/AdminCronActionTest.php
      - name: PHPUnit
        run: composer test
      - name: Deterministic package
        run: |
          set -euo pipefail
          python3 create_fixed_plugin.py
          first="$(sha256sum dist/wp-deep-diagnostics.zip | awk '{print $1}')"
          rm -rf build dist
          python3 create_fixed_plugin.py
          second="$(sha256sum dist/wp-deep-diagnostics.zip | awk '{print $1}')"
          test "$first" = "$second"
          test ! -d wp-deep-diagnostics
          unzip -l dist/wp-deep-diagnostics.zip | grep -q 'wp-deep-diagnostics/wp-deep-diagnostics.php'

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.5', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: wp-cli
          coverage: none
      - name: Build installable plugin
        run: python3 create_fixed_plugin.py
      - name: Install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          mkdir wordpress
          cd wordpress
          if [ "$WP_VERSION" = latest ]; then
            wp core download --quiet
          else
            wp core download --version="$WP_VERSION" --quiet
          fi
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          wp core install --url=http://example.test --title='Deep Diagnostics CI' --admin_user=admin --admin_password='ci-password' --admin_email=admin@example.test --skip-email --quiet
          unzip -q ../dist/wp-deep-diagnostics.zip -d wp-content/plugins
          wp plugin activate wp-deep-diagnostics
      - name: Boot plugin and verify persisted report contract
        working-directory: wordpress
        run: |
          set -euo pipefail
          # Activation changes the active-plugin option after WordPress has already booted,
          # so run one normal command with the plugin active and allow shutdown finalization.
          wp eval 'echo "diagnostic request primed\n";'
          wp eval '
            $report = get_transient("wddtf_last_report");
            if (!is_array($report)) { fwrite(STDERR, "missing report\n"); exit(1); }
            foreach (["meta", "layers", "bottlenecks", "recommendations", "top_offenders", "llm_bundle"] as $key) {
                if (!array_key_exists($key, $report)) { fwrite(STDERR, "missing key: $key\n"); exit(1); }
            }
            if (!isset($report["layers"]["cron"]) || !isset($report["llm_bundle"]["cron"])) {
                fwrite(STDERR, "missing additive cron report section\n"); exit(1);
            }
            $json = get_transient("wddtf_last_report_json");
            $md = get_transient("wddtf_last_report_md");
            if (!is_string($json) || !is_file($json) || !is_string($md) || !is_file($md)) {
                fwrite(STDERR, "report files missing\n"); exit(1);
            }
            echo "diagnostic lifecycle ok\n";
          '
      - name: Verify passive admin render is side-effect-free
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            $hook = \WDDTF\Cron\CronDiagnostics::PROBE_HOOK;
            if (false !== wp_get_scheduled_event($hook)) {
                fwrite(STDERR, "unexpected pre-existing probe\n"); exit(1);
            }
            ob_start();
            (new \WDDTF\Admin\Admin_Page(new \WDDTF\Diagnostics\Manager()))->render();
            $html = ob_get_clean();
            if (false !== wp_get_scheduled_event($hook)) {
                fwrite(STDERR, "admin render scheduled a probe\n"); exit(1);
            }
            if (false === strpos($html, "WP-Cron Diagnostics")) {
                fwrite(STDERR, "cron admin section missing\n"); exit(1);
            }
            echo "passive admin render ok\n";
          ' --user=admin
      - name: Run correlated Cron qualification lifecycle
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            $manager = new \WDDTF\Diagnostics\Manager();
            $result = $manager->startCronQualification();
            if (empty($result["started"]) || "scheduled" !== ($result["reason"] ?? "")) {
                fwrite(STDERR, "qualification did not schedule\n"); exit(1);
            }
            $q = $result["qualification"];
            if ("pending" !== ($q["status"] ?? "") || empty($q["scheduled"]) || empty($q["scheduled_event_present"])) {
                fwrite(STDERR, "qualification not pending with scheduled evidence\n"); exit(1);
            }
            if (empty($q["session_id"]) || null !== $q["observed_timestamp"] || !empty($q["evidence"]["execution_observed"])) {
                fwrite(STDERR, "pending qualification evidence is not truthful\n"); exit(1);
            }
            echo "qualification pending: " . $q["session_id"] . "\n";
          '
          test "$(wp cron event list --field=hook | grep -xc 'wddtf_cron_qualification_probe')" -eq 1
          wp eval '
            $manager = new \WDDTF\Diagnostics\Manager();
            $duplicate = $manager->startCronQualification();
            if (!empty($duplicate["started"]) || "already_pending" !== ($duplicate["reason"] ?? "")) {
                fwrite(STDERR, "duplicate qualification was not prevented\n"); exit(1);
            }
          '
          test "$(wp cron event list --field=hook | grep -xc 'wddtf_cron_qualification_probe')" -eq 1
          wp cron event run wddtf_cron_qualification_probe
          wp eval '
            $q = (new \WDDTF\Diagnostics\Manager())->getCronDiagnostics()["qualification"];
            if ("completed" !== ($q["status"] ?? "") || empty($q["evidence"]["execution_observed"])) {
                fwrite(STDERR, "probe callback was not observed\n"); exit(1);
            }
            if (!is_int($q["observed_timestamp"]) || !is_int($q["delay_seconds"]) || $q["delay_seconds"] < 0) {
                fwrite(STDERR, "invalid observed timing evidence\n"); exit(1);
            }
            echo "qualification completed with delay=" . $q["delay_seconds"] . "s\n";
          '
          # The previous normal request finalizes at shutdown with the correlated Cron evidence.
          wp eval '
            $report = get_transient("wddtf_last_report");
            $cron = $report["layers"]["cron"] ?? null;
            $llmCron = $report["llm_bundle"]["cron"] ?? null;
            if (!is_array($cron) || !is_array($llmCron)) {
                fwrite(STDERR, "cron report evidence missing\n"); exit(1);
            }
            if ("completed" !== ($cron["qualification"]["status"] ?? "")) {
                fwrite(STDERR, "persisted cron qualification not completed\n"); exit(1);
            }
            if (($cron["qualification"]["session_id"] ?? null) !== ($llmCron["qualification"]["session_id"] ?? null)) {
                fwrite(STDERR, "correlation id mismatch across report layers\n"); exit(1);
            }
            $md = get_transient("wddtf_last_report_md");
            if (!is_string($md) || !is_file($md) || false === strpos((string) file_get_contents($md), "WP-Cron Diagnostics")) {
                fwrite(STDERR, "cron markdown section missing\n"); exit(1);
            }
            echo "persisted cron report contract ok\n";
          '
      - name: Verify disabled, pending and stale Cron states
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp config set DISABLE_WP_CRON true --raw --quiet
          wp eval '
            $manager = new \WDDTF\Diagnostics\Manager();
            $configuration = $manager->getCronDiagnostics()["configuration"];
            if (empty($configuration["wp_cron_disabled"]) || "disabled_by_constant" !== ($configuration["mode"] ?? "")) {
                fwrite(STDERR, "disabled Cron configuration not observed\n"); exit(1);
            }
            $result = $manager->startCronQualification();
            if (empty($result["started"]) || "pending" !== ($result["qualification"]["status"] ?? "")) {
                fwrite(STDERR, "disabled-mode probe did not remain truthfully pending\n"); exit(1);
            }
            if (!empty($result["qualification"]["evidence"]["execution_observed"])) {
                fwrite(STDERR, "pending probe incorrectly claimed execution\n"); exit(1);
            }
            echo "disabled pending state ok\n";
          '
          wp cron event delete wddtf_cron_qualification_probe --quiet
          wp eval '
            set_transient("wddtf_cron_qualification_current", "malformed-session-pointer", HOUR_IN_SECONDS);
            $manager = new \WDDTF\Diagnostics\Manager();
            $first = $manager->getCronDiagnostics()["qualification"];
            $second = $manager->getCronDiagnostics()["qualification"];
            if ("unknown" !== ($first["status"] ?? "") || "not_started" !== ($second["status"] ?? "")) {
                fwrite(STDERR, "stale session did not fail closed and self-heal\n"); exit(1);
            }
            echo "stale state handling ok\n";
          '
