name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: |
          set -euo pipefail
          printf '%s\0' wp-deep-diagnostics.php uninstall.php | xargs -0 -n1 php -l
          find src templates tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Focused privacy regression
        run: vendor/bin/phpunit tests/PrivacyBoundaryTest.php
      - name: Focused Cron diagnostics regression
        run: vendor/bin/phpunit tests/SessionStoreTest.php tests/CronDiagnosticsTest.php tests/CronReportTest.php tests/AdminCronActionTest.php
      - name: Focused Gravity diagnostics regression
        run: vendor/bin/phpunit tests/GravityDiagnosticsTest.php tests/GravityReportTest.php tests/AdminGravityActionTest.php
      - name: PHPUnit
        run: composer test
      - name: Deterministic package
        run: |
          set -euo pipefail
          python3 create_fixed_plugin.py
          first="$(sha256sum dist/wp-deep-diagnostics.zip | awk '{print $1}')"
          rm -rf build dist
          python3 create_fixed_plugin.py
          second="$(sha256sum dist/wp-deep-diagnostics.zip | awk '{print $1}')"
          test "$first" = "$second"
          test ! -d wp-deep-diagnostics
          unzip -l dist/wp-deep-diagnostics.zip | grep -q 'wp-deep-diagnostics/wp-deep-diagnostics.php'

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.5', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: wp-cli
          coverage: none
      - name: Build installable plugin
        run: python3 create_fixed_plugin.py
      - name: Install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          mkdir wordpress
          cd wordpress
          if [ "$WP_VERSION" = latest ]; then
            wp core download --quiet
          else
            wp core download --version="$WP_VERSION" --quiet
          fi
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          wp core install --url=http://example.test --title='Deep Diagnostics CI' --admin_user=admin --admin_password='ci-password' --admin_email=admin@example.test --skip-email --quiet
          unzip -q ../dist/wp-deep-diagnostics.zip -d wp-content/plugins
          wp plugin activate wp-deep-diagnostics
      - name: Boot plugin and verify persisted report contract
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval 'echo "diagnostic request primed\n";'
          wp eval '
            $report = get_transient("wddtf_last_report");
            if (!is_array($report)) { fwrite(STDERR, "missing report\n"); exit(1); }
            foreach (["meta", "layers", "bottlenecks", "recommendations", "top_offenders", "llm_bundle"] as $key) {
                if (!array_key_exists($key, $report)) { fwrite(STDERR, "missing key: $key\n"); exit(1); }
            }
            if (!isset($report["layers"]["cron"]) || !isset($report["llm_bundle"]["cron"])) {
                fwrite(STDERR, "missing additive cron report section\n"); exit(1);
            }
            if (!isset($report["layers"]["gravity"]) || !isset($report["llm_bundle"]["gravity"])) {
                fwrite(STDERR, "missing additive gravity report section\n"); exit(1);
            }
            $json = get_transient("wddtf_last_report_json");
            $md = get_transient("wddtf_last_report_md");
            if (!is_string($json) || !is_file($json) || !is_string($md) || !is_file($md)) {
                fwrite(STDERR, "report files missing\n"); exit(1);
            }
            echo "diagnostic lifecycle ok\n";
          '
      - name: Verify absent Gravity Flow fails closed
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            $manager = new \WDDTF\Diagnostics\Manager();
            $gravity = $manager->getGravityDiagnostics();
            if (!empty($gravity["hosts"]["gravity_flow"]["available"])) {
                fwrite(STDERR, "unexpected Gravity Flow runtime\n"); exit(1);
            }
            $result = $manager->startGravityFlowInboxObservation();
            if (!empty($result["started"]) || "gravity_flow_unavailable" !== ($result["reason"] ?? "")) {
                fwrite(STDERR, "absent Gravity Flow did not fail closed\n"); exit(1);
            }
            if (false !== get_transient("wddtf_gravityflow_inbox_observation_current")) {
                fwrite(STDERR, "absent Gravity Flow created observation state\n"); exit(1);
            }
            echo "absent Gravity Flow boundary ok\n";
          '
      - name: Verify passive admin render is side-effect-free
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            $hook = \WDDTF\Cron\CronDiagnostics::PROBE_HOOK;
            set_transient("wddtf_cron_qualification_current", "malformed-session-pointer", HOUR_IN_SECONDS);
            set_transient("wddtf_gravityflow_inbox_observation_current", "malformed-gravity-pointer", HOUR_IN_SECONDS);
            if (false !== wp_get_scheduled_event($hook)) {
                fwrite(STDERR, "unexpected pre-existing probe\n"); exit(1);
            }
            ob_start();
            (new \WDDTF\Admin\Admin_Page(new \WDDTF\Diagnostics\Manager()))->render();
            $html = ob_get_clean();
            if (false !== wp_get_scheduled_event($hook)) {
                fwrite(STDERR, "admin render scheduled a probe\n"); exit(1);
            }
            if ("malformed-session-pointer" !== get_transient("wddtf_cron_qualification_current")) {
                fwrite(STDERR, "admin render mutated stale Cron state\n"); exit(1);
            }
            if ("malformed-gravity-pointer" !== get_transient("wddtf_gravityflow_inbox_observation_current")) {
                fwrite(STDERR, "admin render mutated stale Gravity state\n"); exit(1);
            }
            if (false === strpos($html, "WP-Cron Diagnostics") || false === strpos($html, "Gravity Forms / Gravity Flow Diagnostics")) {
                fwrite(STDERR, "diagnostics admin sections missing\n"); exit(1);
            }
            echo "passive admin render ok\n";
          ' --user=admin
      - name: Run correlated Cron qualification lifecycle
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            delete_transient("wddtf_cron_qualification_current");
            $manager = new \WDDTF\Diagnostics\Manager();
            $result = $manager->startCronQualification();
            if (empty($result["started"]) || "scheduled" !== ($result["reason"] ?? "")) {
                fwrite(STDERR, "qualification did not schedule\n"); exit(1);
            }
            $q = $result["qualification"];
            if ("pending" !== ($q["status"] ?? "") || empty($q["scheduled"]) || empty($q["scheduled_event_present"])) {
                fwrite(STDERR, "qualification not pending with scheduled evidence\n"); exit(1);
            }
            if (empty($q["session_id"]) || null !== $q["observed_timestamp"] || !empty($q["evidence"]["execution_observed"])) {
                fwrite(STDERR, "pending qualification evidence is not truthful\n"); exit(1);
            }
            echo "qualification pending: " . $q["session_id"] . "\n";
          '
          test "$(wp cron event list --field=hook | grep -xc 'wddtf_cron_qualification_probe')" -eq 1
          wp eval '
            $manager = new \WDDTF\Diagnostics\Manager();
            $duplicate = $manager->startCronQualification();
            if (!empty($duplicate["started"]) || "already_pending" !== ($duplicate["reason"] ?? "")) {
                fwrite(STDERR, "duplicate qualification was not prevented\n"); exit(1);
            }
          '
          test "$(wp cron event list --field=hook | grep -xc 'wddtf_cron_qualification_probe')" -eq 1
          wp cron event run wddtf_cron_qualification_probe
          wp eval '
            $q = (new \WDDTF\Diagnostics\Manager())->getCronDiagnostics()["qualification"];
            if ("completed" !== ($q["status"] ?? "") || empty($q["evidence"]["execution_observed"])) {
                fwrite(STDERR, "probe callback was not observed\n"); exit(1);
            }
            if (!is_int($q["observed_timestamp"]) || !is_int($q["delay_seconds"]) || $q["delay_seconds"] < 0) {
                fwrite(STDERR, "invalid observed timing evidence\n"); exit(1);
            }
            echo "qualification completed with delay=" . $q["delay_seconds"] . "s\n";
          '
          wp eval '
            $report = get_transient("wddtf_last_report");
            $cron = $report["layers"]["cron"] ?? null;
            $llmCron = $report["llm_bundle"]["cron"] ?? null;
            if (!is_array($cron) || !is_array($llmCron)) {
                fwrite(STDERR, "cron report evidence missing\n"); exit(1);
            }
            if ("completed" !== ($cron["qualification"]["status"] ?? "")) {
                fwrite(STDERR, "persisted cron qualification not completed\n"); exit(1);
            }
            if (($cron["qualification"]["session_id"] ?? null) !== ($llmCron["qualification"]["session_id"] ?? null)) {
                fwrite(STDERR, "correlation id mismatch across report layers\n"); exit(1);
            }
            $md = get_transient("wddtf_last_report_md");
            if (!is_string($md) || !is_file($md) || false === strpos((string) file_get_contents($md), "WP-Cron Diagnostics")) {
                fwrite(STDERR, "cron markdown section missing\n"); exit(1);
            }
            echo "persisted cron report contract ok\n";
          '
      - name: Verify disabled, pending and stale Cron states
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp config set DISABLE_WP_CRON true --raw --quiet
          wp eval '
            $manager = new \WDDTF\Diagnostics\Manager();
            $configuration = $manager->getCronDiagnostics()["configuration"];
            if (empty($configuration["wp_cron_disabled"]) || "disabled_by_constant" !== ($configuration["mode"] ?? "")) {
                fwrite(STDERR, "disabled Cron configuration not observed\n"); exit(1);
            }
            $result = $manager->startCronQualification();
            if (empty($result["started"]) || "pending" !== ($result["qualification"]["status"] ?? "")) {
                fwrite(STDERR, "disabled-mode probe did not remain truthfully pending\n"); exit(1);
            }
            if (!empty($result["qualification"]["evidence"]["execution_observed"])) {
                fwrite(STDERR, "pending probe incorrectly claimed execution\n"); exit(1);
            }
            echo "disabled pending state ok\n";
          '
          wp cron event delete wddtf_cron_qualification_probe --quiet
          wp eval '
            $manager = new \WDDTF\Diagnostics\Manager();
            $pointerBefore = get_transient("wddtf_cron_qualification_current");
            $first = $manager->getCronDiagnostics()["qualification"];
            $second = $manager->getCronDiagnostics()["qualification"];
            if ("unknown" !== ($first["status"] ?? "") || "pending_event_not_observable" !== ($first["reason"] ?? "")) {
                fwrite(STDERR, "missing scheduled event did not become ambiguous\n"); exit(1);
            }
            if ($first !== $second || $pointerBefore !== get_transient("wddtf_cron_qualification_current")) {
                fwrite(STDERR, "passive stale reads mutated state\n"); exit(1);
            }
            $recovered = $manager->startCronQualification();
            if (empty($recovered["started"]) || "pending" !== ($recovered["qualification"]["status"] ?? "")) {
                fwrite(STDERR, "explicit qualification did not recover stale state\n"); exit(1);
            }
            echo "stale state recovery ok\n";
          '
      - name: Verify explicit Cron admin POST boundary
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            $id = get_transient("wddtf_cron_qualification_current");
            if (is_string($id) && preg_match("/^ds-[a-f0-9]{16}$/", $id)) {
                delete_transient("wddtf_diag_session_" . substr(hash("sha256", $id), 0, 32));
            }
            delete_transient("wddtf_cron_qualification_current");
            wp_clear_scheduled_hook(\WDDTF\Cron\CronDiagnostics::PROBE_HOOK);
          '
          wp eval '
            add_filter(
                "wp_die_handler",
                static fn(): callable => static function(mixed $message): void {
                    throw new RuntimeException((string) $message);
                },
                PHP_INT_MAX
            );
            $_SERVER["REQUEST_METHOD"] = "GET";
            $_REQUEST["_wpnonce"] = wp_create_nonce("wddtf_run_cron_qualification");
            $rejected = false;
            try {
                (new \WDDTF\Admin\Admin_Page(new \WDDTF\Diagnostics\Manager()))->runCronQualification();
            } catch (RuntimeException $exception) {
                $rejected = true;
            }
            if (!$rejected) {
                fwrite(STDERR, "GET request was not rejected\n"); exit(1);
            }
            if (false !== wp_get_scheduled_event(\WDDTF\Cron\CronDiagnostics::PROBE_HOOK)) {
                fwrite(STDERR, "GET request created a probe\n"); exit(1);
            }
            echo "admin GET rejection boundary ok\n";
          ' --user=admin
          wp eval '
            add_filter(
                "wp_redirect",
                static function(string $location): string {
                    throw new RuntimeException("redirect intercepted");
                },
                PHP_INT_MIN
            );
            $_SERVER["REQUEST_METHOD"] = "POST";
            $_REQUEST["_wpnonce"] = wp_create_nonce("wddtf_run_cron_qualification");
            $redirected = false;
            try {
                (new \WDDTF\Admin\Admin_Page(new \WDDTF\Diagnostics\Manager()))->runCronQualification();
            } catch (RuntimeException $exception) {
                $redirected = "redirect intercepted" === $exception->getMessage();
            }
            if (!$redirected) {
                fwrite(STDERR, "POST action did not reach redirect boundary\n"); exit(1);
            }
            $q = (new \WDDTF\Diagnostics\Manager())->getCronDiagnostics()["qualification"];
            if ("pending" !== ($q["status"] ?? "") || empty($q["scheduled_event_present"])) {
                fwrite(STDERR, "admin POST did not create the intended pending probe\n"); exit(1);
            }
            echo "explicit admin POST boundary ok\n";
          ' --user=admin
      - name: Install CI-only Gravity host fixture
        working-directory: wordpress
        run: |
          set -euo pipefail
          mkdir -p wp-content/plugins/wddtf-gravity-fixture
          cat > wp-content/plugins/wddtf-gravity-fixture/wddtf-gravity-fixture.php <<'PHP'
          <?php
          /**
           * Plugin Name: WDDTF Gravity Host Fixture
           */
          if (!class_exists('GFForms')) {
              final class GFForms {
                  public static string $version = '3.1.1.1';
              }
          }
          if (!defined('GRAVITY_FLOW_VERSION')) {
              define('GRAVITY_FLOW_VERSION', '3.1.0');
          }
          function wddtf_gravity_fixture_inbox_ajax(): void {
              apply_filters(
                  'gravityflow_columns_inbox_table',
                  ['entry' => 'Entry'],
                  [
                      'entry' => 'SecretInboxCanary123456789012345',
                      'form_id' => 91,
                      'entry_id' => 812,
                  ]
              );
              wp_send_json_success(['ok' => true]);
          }
          add_action('wp_ajax_wddtf_fixture_inbox', 'wddtf_gravity_fixture_inbox_ajax');
          add_action('wp_ajax_nopriv_wddtf_fixture_inbox', 'wddtf_gravity_fixture_inbox_ajax');
          PHP
          wp plugin activate wddtf-gravity-fixture
      - name: Verify explicit Gravity Inbox POST boundary
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            $id = get_transient("wddtf_gravityflow_inbox_observation_current");
            if (is_string($id) && preg_match("/^ds-[a-f0-9]{16}$/", $id)) {
                delete_transient("wddtf_diag_session_" . substr(hash("sha256", $id), 0, 32));
            }
            delete_transient("wddtf_gravityflow_inbox_observation_current");
          '
          wp eval '
            add_filter(
                "wp_die_handler",
                static fn(): callable => static function(mixed $message): void {
                    throw new RuntimeException((string) $message);
                },
                PHP_INT_MAX
            );
            $_SERVER["REQUEST_METHOD"] = "GET";
            $_REQUEST["_wpnonce"] = wp_create_nonce("wddtf_start_gravityflow_inbox_observation");
            $rejected = false;
            try {
                (new \WDDTF\Admin\Admin_Page(new \WDDTF\Diagnostics\Manager()))->startGravityFlowInboxObservation();
            } catch (RuntimeException $exception) {
                $rejected = true;
            }
            if (!$rejected) {
                fwrite(STDERR, "Gravity GET request was not rejected\n"); exit(1);
            }
            if (false !== get_transient("wddtf_gravityflow_inbox_observation_current")) {
                fwrite(STDERR, "Gravity GET request created observation state\n"); exit(1);
            }
            echo "Gravity admin GET rejection boundary ok\n";
          ' --user=admin
          wp eval '
            add_filter(
                "wp_redirect",
                static function(string $location): string {
                    throw new RuntimeException("redirect intercepted");
                },
                PHP_INT_MIN
            );
            $_SERVER["REQUEST_METHOD"] = "POST";
            $_REQUEST["_wpnonce"] = wp_create_nonce("wddtf_start_gravityflow_inbox_observation");
            $redirected = false;
            try {
                (new \WDDTF\Admin\Admin_Page(new \WDDTF\Diagnostics\Manager()))->startGravityFlowInboxObservation();
            } catch (RuntimeException $exception) {
                $redirected = "redirect intercepted" === $exception->getMessage();
            }
            if (!$redirected) {
                fwrite(STDERR, "Gravity POST action did not reach redirect boundary\n"); exit(1);
            }
            $gravity = (new \WDDTF\Diagnostics\Manager())->getGravityDiagnostics();
            $observation = $gravity["inbox_observation"] ?? [];
            if ("observing" !== ($observation["status"] ?? "")) {
                fwrite(STDERR, "Gravity POST did not create observation session\n"); exit(1);
            }
            if ("3.1.1.1" !== ($gravity["hosts"]["gravity_forms"]["version"] ?? null) || "3.1.0" !== ($gravity["hosts"]["gravity_flow"]["version"] ?? null)) {
                fwrite(STDERR, "fixture host versions not observed\n"); exit(1);
            }
            ob_start();
            (new \WDDTF\Admin\Admin_Page(new \WDDTF\Diagnostics\Manager()))->render();
            $html = ob_get_clean();
            if (false !== strpos($html, "id=\"submit\" class=\"button\" value=\"Start Inbox Observation\" disabled=\"\"")) {
                fwrite(STDERR, "available Gravity Flow action rendered disabled\n"); exit(1);
            }
            echo "explicit Gravity Inbox POST boundary ok\n";
          ' --user=admin
      - name: Exercise cross-request AJAX Inbox observation
        working-directory: wordpress
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 >/tmp/wddtf-gravity-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS -H 'Host: example.test' -X POST 'http://127.0.0.1:8080/wp-admin/admin-ajax.php' --data 'action=wddtf_fixture_inbox' >/tmp/wddtf-gravity-ajax.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/wddtf-gravity-server.log >&2 || true
            exit 1
          fi
          grep -q '"success":true' /tmp/wddtf-gravity-ajax.json
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          wp eval '
            $gravity = (new \WDDTF\Diagnostics\Manager())->getGravityDiagnostics();
            $observation = $gravity["inbox_observation"] ?? [];
            if ("observing" !== ($observation["status"] ?? "")) {
                fwrite(STDERR, "observation session not active after AJAX sample\n"); exit(1);
            }
            if (1 !== ($observation["sample_count_total"] ?? 0) || 1 !== ($observation["ajax_sample_count"] ?? 0)) {
                fwrite(STDERR, "AJAX Inbox sample not correlated\n"); exit(1);
            }
            $sample = $observation["samples"][0] ?? [];
            if ("ajax" !== ($sample["transport"] ?? "") || "gravityflow_columns_inbox_table" !== ($sample["observer_hook"] ?? "")) {
                fwrite(STDERR, "AJAX sample context incorrect\n"); exit(1);
            }
            if (!isset($sample["elapsed_ms"]) || (float) $sample["elapsed_ms"] < 0 || empty($sample["memory_peak_bytes"])) {
                fwrite(STDERR, "AJAX sample timing metadata missing\n"); exit(1);
            }
            $encoded = (string) wp_json_encode($gravity);
            foreach (["SecretInboxCanary123456789012345", "\"form_id\"", "\"entry_id\""] as $forbidden) {
                if (false !== strpos($encoded, $forbidden)) {
                    fwrite(STDERR, "sensitive fixture value leaked: $forbidden\n"); exit(1);
                }
            }
            if (!empty($observation["evidence"]["raw_form_entry_values_stored"])) {
                fwrite(STDERR, "privacy evidence incorrect\n"); exit(1);
            }
            echo "cross-request AJAX Inbox sample ok\n";
          '
      - name: Integrate Gravity observation into normal report
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval 'echo "gravity report primed\n";'
          wp eval '
            $report = get_transient("wddtf_last_report");
            $gravity = $report["layers"]["gravity"] ?? null;
            $llmGravity = $report["llm_bundle"]["gravity"] ?? null;
            if (!is_array($gravity) || !is_array($llmGravity)) {
                fwrite(STDERR, "persisted Gravity evidence missing\n"); exit(1);
            }
            if (1 !== ($gravity["inbox_observation"]["ajax_sample_count"] ?? 0)) {
                fwrite(STDERR, "persisted AJAX Inbox evidence missing\n"); exit(1);
            }
            if (($gravity["inbox_observation"]["session_id"] ?? null) !== ($llmGravity["inbox_observation"]["session_id"] ?? null)) {
                fwrite(STDERR, "Gravity session correlation mismatch\n"); exit(1);
            }
            $encoded = (string) wp_json_encode($report);
            if (false !== strpos($encoded, "SecretInboxCanary123456789012345")) {
                fwrite(STDERR, "fixture canary leaked into report\n"); exit(1);
            }
            $md = get_transient("wddtf_last_report_md");
            if (!is_string($md) || !is_file($md) || false === strpos((string) file_get_contents($md), "Gravity Forms / Gravity Flow Diagnostics")) {
                fwrite(STDERR, "Gravity markdown section missing\n"); exit(1);
            }
            echo "persisted Gravity report contract ok\n";
          '
