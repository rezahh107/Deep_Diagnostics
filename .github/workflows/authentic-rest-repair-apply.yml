name: Apply authentic REST correlation repair

on:
  push:
    branches:
      - qualify/authentic-gravity-runtime
    paths:
      - '.github/workflows/authentic-rest-repair-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualify/authentic-gravity-runtime
          fetch-depth: 1

      - name: Apply narrow authentic REST correlation repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gravity = Path('src/Gravity/GravityDiagnostics.php')
          text = gravity.read_text()
          old = """    private function maybeTagBrowserResponse(): void {\n        if ( $this->browserHeaderEmitted || 'ajax' !== $this->requestTransport() || ! $this->browserEvidenceAuthorized() || [] === $this->inboxCandidateTraceRefs ) {\n            return;\n        }\n"""
          new = """    private function maybeTagBrowserResponse(): void {\n        $transport = $this->requestTransport();\n        if (\n            $this->browserHeaderEmitted ||\n            ! in_array($transport, ['ajax', 'rest'], true) ||\n            ! $this->browserEvidenceAuthorized() ||\n            [] === $this->inboxCandidateTraceRefs\n        ) {\n            return;\n        }\n"""
          if old not in text:
              if new not in text:
                  raise SystemExit('GravityDiagnostics tagging gate did not match expected source')
          else:
              text = text.replace(old, new, 1)
              gravity.write_text(text)

          test = Path('tests/GravityBrowserEvidenceTest.php')
          text = test.read_text()
          marker = """    public function test_unrelated_ajax_never_becomes_server_or_browser_evidence(): void {\n"""
          addition = """    /**\n     * @runInSeparateProcess\n     * @preserveGlobalState disabled\n     */\n    public function test_candidate_linked_rest_refresh_is_tagged_without_broad_rest_capture(): void {\n        $now = 1000;\n        $headers = [];\n        $diagnostics = $this->makeDiagnostics($now, $headers);\n        $this->authorizeInboxOperator();\n        $diagnostics->startDiagnostic();\n        $this->seedPositiveServerChain($diagnostics, 812, 91);\n\n        define('REST_REQUEST', true);\n        $diagnostics->observeInboxRender([], []);\n        $diagnostics->observeInboxFieldValue('row-value', 91, 5, ['id' => 812, 'form_id' => 91]);\n        $diagnostics->persistObservedInboxRequest();\n\n        self::assertCount(1, $headers);\n        self::assertSame(GravityDiagnostics::BROWSER_SAMPLE_HEADER, $headers[0][0]);\n        self::assertMatchesRegularExpression('/^gb-[a-f0-9]{20}$/', $headers[0][1]);\n\n        $observation = $diagnostics->currentInboxObservation();\n        self::assertSame(1, $observation['sample_count_total']);\n        self::assertSame('rest', $observation['samples'][0]['transport']);\n        self::assertSame($headers[0][1], $observation['samples'][0]['sample_ref']);\n        self::assertCount(1, $observation['samples'][0]['candidate_trace_refs']);\n        self::assertSame('TRACE_COMPLETE_TO_SERVER_INBOX_OBSERVATION', $observation['analysis']['classification']);\n        self::assertSame('BROWSER_REFRESH_NOT_OBSERVED', $observation['browser_analysis']['classification']);\n    }\n\n    /**\n     * @runInSeparateProcess\n     * @preserveGlobalState disabled\n     */\n    public function test_unrelated_rest_never_becomes_server_or_browser_evidence(): void {\n        $now = 1000;\n        $headers = [];\n        $diagnostics = $this->makeDiagnostics($now, $headers);\n        $this->authorizeInboxOperator();\n        $diagnostics->startDiagnostic();\n\n        define('REST_REQUEST', true);\n        $diagnostics->persistObservedInboxRequest();\n        $observation = $diagnostics->currentInboxObservation();\n\n        self::assertSame([], $headers);\n        self::assertSame(0, $observation['sample_count_total']);\n        self::assertSame(0, $observation['browser_evidence_count']);\n        self::assertSame('BROWSER_EVIDENCE_INSUFFICIENT', $observation['browser_analysis']['classification']);\n    }\n\n"""
          if 'test_candidate_linked_rest_refresh_is_tagged_without_broad_rest_capture' not in text:
              if marker not in text:
                  raise SystemExit('Gravity browser test insertion marker not found')
              text = text.replace(marker, addition + marker, 1)
              test.write_text(text)
          PY

          php -l src/Gravity/GravityDiagnostics.php
          php -l tests/GravityBrowserEvidenceTest.php

      - name: Commit repair to qualification branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Gravity/GravityDiagnostics.php tests/GravityBrowserEvidenceTest.php
          if git diff --cached --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi
          git commit -m 'fix: tag candidate-linked Gravity REST refreshes'
          git push origin HEAD:qualify/authentic-gravity-runtime
