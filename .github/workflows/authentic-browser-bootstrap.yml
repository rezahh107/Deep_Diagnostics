name: Authentic qualification browser bootstrap

on:
  push:
    branches:
      - qualify/authentic-gravity-runtime
    paths:
      - '.github/workflows/authentic-browser-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - name: Stage standalone browser
        run: |
          set -euo pipefail
          command -v google-chrome || command -v google-chrome-stable
          google-chrome --version || google-chrome-stable --version
          mkdir -p browser-bootstrap
          cp -a /opt/google/chrome browser-bootstrap/chrome
          sha256sum browser-bootstrap/chrome/chrome > browser-bootstrap/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: authentic-qualification-browser
          path: browser-bootstrap
          if-no-files-found: error
          retention-days: 1
