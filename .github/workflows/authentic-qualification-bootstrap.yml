name: Finalize authentic Gravity qualification branch

on:
  push:
    branches:
      - qualify/authentic-gravity-runtime
    paths:
      - '.github/workflows/authentic-qualification-bootstrap.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qualify/authentic-gravity-runtime
          fetch-depth: 0

      - name: Apply verified local qualification patch
        run: |
          set -euo pipefail
          cat > /tmp/authentic-final.patch.gz.b64 <<'B64'

B64
          base64 -d /tmp/authentic-final.patch.gz.b64 | gzip -d > /tmp/authentic-final.patch
          git apply -p1 /tmp/authentic-final.patch
          git rm -f .github/workflows/authentic-qualification-bootstrap.yml \
                    .github/workflows/authentic-source-bundle.yml \
                    .github/workflows/authentic-browser-bootstrap.yml
          git status --short

      - name: Commit final qualification changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: qualify authentic Gravity runtime'
          git push origin HEAD:qualify/authentic-gravity-runtime
