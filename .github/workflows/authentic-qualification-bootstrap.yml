name: Authentic qualification runtime bridge

on:
  push:
    branches:
      - qualify/authentic-gravity-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build deterministic DEEP artifact
        run: |
          set -euo pipefail
          python3 create_fixed_plugin.py
          mkdir -p qualification-runtime/deep
          cp dist/wp-deep-diagnostics.zip qualification-runtime/deep/
          sha256sum dist/wp-deep-diagnostics.zip > qualification-runtime/deep/SHA256SUMS
          git rev-parse HEAD > qualification-runtime/deep/COMMIT

      - name: Download standalone Playwright Chromium
        run: |
          set -euo pipefail
          npx --yes playwright@1.55.0 install chromium
          mkdir -p qualification-runtime/browser
          cp -a "$HOME/.cache/ms-playwright" qualification-runtime/browser/
          find qualification-runtime/browser/ms-playwright -type f -name chrome -o -name headless_shell

      - uses: actions/upload-artifact@v4
        with:
          name: authentic-qualification-runtime
          path: qualification-runtime
          if-no-files-found: error
          retention-days: 1
