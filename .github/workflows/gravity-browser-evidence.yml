name: Gravity browser evidence fixture

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gravity-browser-evidence:
    name: Gravity browser fixture / WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.5', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2,wp-cli
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP test dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Focused browser evidence contract
        run: vendor/bin/phpunit tests/GravityBrowserEvidenceTest.php

      - name: Build generated plugin artifact
        run: python3 create_fixed_plugin.py

      - name: Install WordPress and generated artifact
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail
          mkdir wordpress
          cd wordpress
          if [ "$WP_VERSION" = latest ]; then
            wp core download --quiet
          else
            wp core download --version="$WP_VERSION" --quiet
          fi
          wp config create --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          wp core install --url=http://127.0.0.1:8080 --title='Deep Diagnostics browser evidence CI' --admin_user=admin --admin_password='ci-password' --admin_email=admin@example.test --skip-email --quiet
          unzip -q ../dist/wp-deep-diagnostics.zip -d wp-content/plugins
          wp plugin activate wp-deep-diagnostics

      - name: Install CI-only Gravity browser fixture
        working-directory: wordpress
        run: |
          set -euo pipefail
          mkdir -p wp-content/plugins/wddtf-gravity-browser-fixture
          cat > wp-content/plugins/wddtf-gravity-browser-fixture/wddtf-gravity-browser-fixture.php <<'PHP'
          <?php
          /**
           * Plugin Name: WDDTF Gravity Browser Fixture
           * Description: CI-only modeled Gravity Inbox browser refresh fixture. Not Gravity Flow.
           */
          if (!class_exists('GFForms')) {
              final class GFForms {
                  public static string $version = 'fixture-3.1.1.1';
              }
          }
          if (!defined('GRAVITY_FLOW_VERSION')) {
              define('GRAVITY_FLOW_VERSION', 'fixture-3.1.0');
          }

          final class WDDTF_Browser_CI_Step {
              public function __construct(private int $id, private int $entryId, private int $formId) {}
              public function get_id(): int { return $this->id; }
              public function get_entry_id(): int { return $this->entryId; }
              public function get_form_id(): int { return $this->formId; }
              public function get_type(): string { return 'approval'; }
              public function get_status(): string { return 'pending'; }
          }

          final class WDDTF_Browser_CI_Assignee {
              public function get_key(): string { return 'user_id|765'; }
              public function get_id(): string { return '765'; }
          }

          function wddtf_browser_ci_entry(): array {
              return [
                  'id' => 7654321,
                  'form_id' => 8765432,
                  '1' => 'SecretBrowserFieldCanary123456789012345',
                  '2' => 'private-browser-person@example.test',
                  '3' => '+15559876543',
              ];
          }

          function wddtf_browser_ci_seed(): void {
              $entry = wddtf_browser_ci_entry();
              $form = ['id' => 8765432, 'title' => 'Private Browser Fixture Form'];
              $step = new WDDTF_Browser_CI_Step(9876543, 7654321, 8765432);
              do_action('gform_entry_created', $entry, $form);
              do_action('gform_after_submission', $entry, $form);
              do_action('gravityflow_step_start', 9876543, 7654321, 8765432, 'pending', $step);
              apply_filters('gravityflow_step_assignees', [new WDDTF_Browser_CI_Assignee()], $step);
          }

          function wddtf_browser_ci_unrelated(): void {
              wp_send_json_success(['payload' => 'UnrelatedBrowserCanary123456789012345']);
          }

          function wddtf_browser_ci_refresh(): void {
              $entry = wddtf_browser_ci_entry();
              apply_filters(
                  'gravityflow_columns_inbox_table',
                  ['entry' => 'Entry'],
                  ['entry' => 'SecretInboxArgsBrowserCanary123456789012345', 'entry_id' => 7654321]
              );
              apply_filters(
                  'gravityflow_inbox_field_value',
                  'SecretInboxRowBrowserCanary123456789012345',
                  8765432,
                  5,
                  $entry
              );
              wp_send_json_success([
                  'payload' => 'SecretResponseBodyBrowserCanary123456789012345',
                  'modeled' => true,
              ]);
          }

          add_action('wp_ajax_wddtf_browser_ci_unrelated', 'wddtf_browser_ci_unrelated');
          add_action('wp_ajax_wddtf_browser_ci_refresh', 'wddtf_browser_ci_refresh');

          add_action('admin_menu', static function(): void {
              add_management_page(
                  'WDDTF Browser Fixture',
                  'WDDTF Browser Fixture',
                  'gravityflow_inbox',
                  'wddtf-browser-fixture',
                  'wddtf_browser_ci_render'
              );
          });

          function wddtf_browser_ci_render(): void {
              do_action('gravityflow_enqueue_admin_scripts');
              apply_filters('gravityflow_inbox_args', ['fixture' => true]);
              wp_enqueue_script('jquery');
              ?>
              <div class="wrap">
                  <h1>CI-only modeled Gravity Inbox</h1>
                  <div id="wddtf-browser-fixture-status" data-updated="0">Initial fixture state</div>
              </div>
              <script>
              jQuery(function ($) {
                  $.ajax({
                      url: window.ajaxurl,
                      method: 'POST',
                      data: {action: 'wddtf_browser_ci_unrelated'}
                  }).always(function () {
                      $.ajax({
                          url: window.ajaxurl,
                          method: 'POST',
                          data: {action: 'wddtf_browser_ci_refresh'}
                      }).done(function () {
                          document.title = 'WDDTF fixture updated';
                          document.getElementById('wddtf-browser-fixture-status').setAttribute('data-updated', '1');
                      });
                  });
              });
              </script>
              <?php
          }
          PHP
          wp plugin activate wddtf-gravity-browser-fixture
          wp eval '$role = get_role("administrator"); if (!$role) { exit(1); } $role->add_cap("gravityflow_inbox");'

      - name: Start diagnostic and seed modeled server lifecycle
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            delete_transient("wddtf_gravityflow_inbox_observation_current");
            $result = (new \\WDDTF\\Diagnostics\\Manager())->startGravityDiagnostic();
            if (empty($result["started"])) { fwrite(STDERR, "diagnostic did not start\n"); exit(1); }
            wddtf_browser_ci_seed();
            $o = (new \\WDDTF\\Diagnostics\\Manager())->getGravityDiagnostics()["inbox_observation"];
            if (1 !== ($o["trace_count"] ?? 0)) { fwrite(STDERR, "seed trace missing\n"); exit(1); }
            if ("INBOX_REFRESH_NOT_OBSERVED" !== ($o["analysis"]["classification"] ?? "")) { fwrite(STDERR, "seed server classification mismatch\n"); exit(1); }
          '

      - name: Install Chromium browser automation
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise modeled Inbox refresh in real Chromium
        working-directory: wordpress
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8080 >/tmp/wddtf-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/wp-login.php >/dev/null; then
              break
            fi
            sleep 1
          done

          cat > /tmp/wddtf-browser-test.cjs <<'JS'
          const { chromium } = require(process.cwd().replace(/\/wordpress$/, '') + '/node_modules/playwright');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage();
            const base = 'http://127.0.0.1:8080';

            await page.goto(base + '/wp-login.php', {waitUntil: 'domcontentloaded'});
            await page.fill('#user_login', 'admin');
            await page.fill('#user_pass', 'ci-password');
            await Promise.all([
              page.waitForURL(/wp-admin/),
              page.click('#wp-submit')
            ]);

            const unrelatedPromise = page.waitForResponse((response) => {
              const data = response.request().postData() || '';
              return data.includes('action=wddtf_browser_ci_unrelated');
            });
            const refreshPromise = page.waitForResponse((response) => {
              const data = response.request().postData() || '';
              return data.includes('action=wddtf_browser_ci_refresh');
            });
            const evidencePromise = page.waitForResponse((response) => {
              const data = response.request().postData() || '';
              return data.includes('action=wddtf_record_gravity_browser_evidence');
            });

            await page.goto(base + '/wp-admin/tools.php?page=wddtf-browser-fixture', {waitUntil: 'domcontentloaded'});

            const unrelated = await unrelatedPromise;
            const refresh = await refreshPromise;
            const evidence = await evidencePromise;

            if (unrelated.headers()['x-wddtf-gravity-sample']) {
              throw new Error('unrelated AJAX received diagnostic sample header');
            }
            const sampleRef = refresh.headers()['x-wddtf-gravity-sample'] || '';
            if (!/^gb-[a-f0-9]{20}$/.test(sampleRef)) {
              throw new Error('relevant refresh missing bounded sample header');
            }
            if (evidence.status() !== 200) {
              throw new Error('browser evidence endpoint did not return 200');
            }
            const evidenceJson = await evidence.json();
            if (!evidenceJson.success || !evidenceJson.data || !evidenceJson.data.accepted) {
              throw new Error('browser evidence endpoint did not accept correlated evidence');
            }

            await page.waitForFunction(() => document.querySelector('#wddtf-browser-fixture-status')?.getAttribute('data-updated') === '1');
            if ((await page.title()) !== 'WDDTF fixture updated') {
              throw new Error('modeled UI title signal missing');
            }

            console.log('fixture sample ref:', sampleRef);
            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS

          node /tmp/wddtf-browser-test.cjs

          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Verify bounded browser evidence and privacy
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval '
            $o = (new \\WDDTF\\Diagnostics\\Manager())->getGravityDiagnostics()["inbox_observation"];
            if (1 !== ($o["sample_count_total"] ?? 0) || 1 !== ($o["ajax_sample_count"] ?? 0)) {
                fwrite(STDERR, "unrelated AJAX entered Inbox samples\n"); exit(1);
            }
            if (1 !== ($o["browser_evidence_count"] ?? 0)) { fwrite(STDERR, "browser evidence count mismatch\n"); exit(1); }
            if ("TRACE_COMPLETE_TO_SERVER_INBOX_OBSERVATION" !== ($o["analysis"]["classification"] ?? "")) {
                fwrite(STDERR, "server classification regressed\n"); exit(1);
            }
            if ("BROWSER_UI_SIGNAL_OBSERVED" !== ($o["browser_analysis"]["classification"] ?? "")) {
                fwrite(STDERR, "browser UI classification missing\n"); exit(1);
            }
            if (!empty($o["browser_analysis"]["entry_visible_to_user_proven"])) {
                fwrite(STDERR, "browser signal overclaimed user visibility\n"); exit(1);
            }
            $sample = $o["samples"][0] ?? [];
            if (!preg_match("/^gb-[a-f0-9]{20}$/", (string) ($sample["sample_ref"] ?? ""))) {
                fwrite(STDERR, "opaque sample ref missing\n"); exit(1);
            }
            if (!is_array($sample["browser"] ?? null)) { fwrite(STDERR, "browser sample metadata missing\n"); exit(1); }
            $encoded = (string) wp_json_encode($o);
            foreach ([
                "SecretBrowserFieldCanary123456789012345",
                "SecretInboxArgsBrowserCanary123456789012345",
                "SecretInboxRowBrowserCanary123456789012345",
                "SecretResponseBodyBrowserCanary123456789012345",
                "UnrelatedBrowserCanary123456789012345",
                "private-browser-person@example.test",
                "7654321",
                "8765432",
                "9876543",
                "\"entry_id\"",
                "\"form_id\"",
                "\"step_id\""
            ] as $forbidden) {
                if (false !== strpos($encoded, $forbidden)) {
                    fwrite(STDERR, "privacy leak in browser evidence: $forbidden\n"); exit(1);
                }
            }
            echo "bounded browser evidence and privacy ok\n";
          '

      - name: Verify report Markdown and LLM browser contract
        working-directory: wordpress
        run: |
          set -euo pipefail
          wp eval 'echo "normal report finalization\n";'
          wp eval '
            $report = get_transient("wddtf_last_report");
            $gravity = $report["layers"]["gravity"]["inbox_observation"] ?? null;
            $llm = $report["llm_bundle"]["gravity"]["inbox_observation"] ?? null;
            if (!is_array($gravity) || !is_array($llm)) { fwrite(STDERR, "browser report contract missing\n"); exit(1); }
            if (($gravity["browser_analysis"]["classification"] ?? null) !== ($llm["browser_analysis"]["classification"] ?? null)) {
                fwrite(STDERR, "LLM browser classification mismatch\n"); exit(1);
            }
            if ("BROWSER_UI_SIGNAL_OBSERVED" !== ($gravity["browser_analysis"]["classification"] ?? "")) {
                fwrite(STDERR, "persisted browser analysis missing\n"); exit(1);
            }
            $md = get_transient("wddtf_last_report_md");
            if (!is_string($md) || !is_file($md)) { fwrite(STDERR, "Markdown path missing\n"); exit(1); }
            $markdown = (string) file_get_contents($md);
            foreach (["Browser analysis: BROWSER_UI_SIGNAL_OBSERVED", "Entry visible to user proven: no"] as $required) {
                if (false === strpos($markdown, $required)) { fwrite(STDERR, "Markdown browser contract missing: $required\n"); exit(1); }
            }
            foreach (["SecretResponseBodyBrowserCanary123456789012345", "private-browser-person@example.test", "7654321"] as $forbidden) {
                if (false !== strpos($markdown, $forbidden)) { fwrite(STDERR, "Markdown browser privacy leak: $forbidden\n"); exit(1); }
            }
            echo "browser report/Markdown/LLM contract ok\n";
          '
